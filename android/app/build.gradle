plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def hasReleaseKey = System.getenv('KEYSTORE_FILE') != null && !System.getenv('KEYSTORE_FILE').isEmpty()

android {
    // The app's own R and BuildConfig. The code keeps the package com.xlollx.songport.ytmbridge,
    // whose namespace belongs to the :bridge library.
    namespace 'com.xlollx.songport.ytmbridge.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.xlollx.songport.ytmbridge"
        minSdk 26
        targetSdk 36
        versionCode 39
        versionName "1.5.2"
        // The oldest Trackhop this build works with, from gradle.properties.
        buildConfigField "int", "MIN_TRACKHOP", project.property('minTrackhopVersionCode')
    }

    signingConfigs {
        // As in Trackhop: a fixed debug key when app/debug.keystore exists.
        debug {
            def fixedDebugKey = file("debug.keystore")
            if (fixedDebugKey.exists()) {
                storeFile fixedDebugKey
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        release {
            if (hasReleaseKey) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    implementation platform('androidx.compose:compose-bom:2025.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    // The daily update check.
    implementation 'androidx.work:work-runtime-ktx:2.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'
    // The connectors: sign-in screens, web players and BridgeCore, the methods BridgeProvider serves.
    implementation project(':bridge')

    // The IPC contract test (Robolectric for the provider, no network).
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

// The release's bridge.json (the workflow publishes it with every release): this version and the
// oldest Trackhop it works with. The update check of installed Bridges reads it.
tasks.register('bridgeJson') {
    def out = layout.buildDirectory.file('bridge.json')
    def json = groovy.json.JsonOutput.toJson([
        versionCode    : android.defaultConfig.versionCode,
        versionName    : android.defaultConfig.versionName,
        minTrackhop    : project.property('minTrackhopVersionCode').toInteger(),
        minTrackhopName: project.property('minTrackhopVersionName'),
    ])
    inputs.property('json', json)
    outputs.file(out)
    doLast { out.get().asFile.text = json + '\n' }
}
