name: Bug report
description: A connector stopped working or misbehaves. Italiano va benissimo.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        The services change their web interfaces without notice, so most Trackhop Bridge issues are "it
        worked yesterday". What fixes them fast is Trackhop's **technical details report** (Settings → *Sync
        log* → *Share technical details*): it includes the plugin statistics and the last error messages. For Amazon
        Music, the **Capture traffic** screen in Trackhop Bridge produces a file with the player's calls
        (cookies and tokens stripped): attach it when a method stopped working.
  - type: input
    id: version
    attributes:
      label: Trackhop Bridge version and Trackhop version
      placeholder: "Trackhop Bridge 1.4.0, Trackhop 1.2.3"
    validations:
      required: true
  - type: dropdown
    id: service
    attributes:
      label: Connector
      options: [YouTube Music, Amazon Music, Spotify, Apple Music sign-in]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what the Bridge or Trackhop showed. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Trackhop technical details report
      render: text
  - type: input
    id: device
    attributes:
      label: Phone and Android version
