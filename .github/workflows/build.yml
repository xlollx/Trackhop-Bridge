name: Build

# Builds and tests Trackhop Bridge on every push, pull request and by hand. When the versionName in
# app/build.gradle has no matching tag yet, a push to main creates the tag and publishes the signed
# release APK, with bridge.json for the Bridge's update check, as a GitHub Release (the Bridge is
# distributed only here, never on Google Play).
# Pushing a tag v* by hand publishes a release for that tag too.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install platform and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Fixed debug key (if configured)
        if: ${{ env.DEBUG_KEYSTORE_BASE64 != '' }}
        run: echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug.keystore

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # The connectors' contract tests (local mock servers, no network) and the IPC contract.
      - name: Unit tests
        run: gradle testDebugUnitTest :ytm:test --no-daemon --stacktrace

      # The release's bridge.json: this version and the oldest Trackhop it works with
      # (minTrackhopVersionCode in gradle.properties). Made on every build, so branch runs check it too.
      - name: Release metadata (bridge.json)
        run: |
          gradle :app:bridgeJson --no-daemon --quiet
          python3 -m json.tool app/build/bridge.json
          cp app/build/bridge.json "$GITHUB_WORKSPACE/bridge.json"
          # The same JSON heads the release notes as a hidden comment: installed Bridges read it from
          # the API's release answer, so the update check never contacts a host other than api.github.com.
          # Keep that line when editing the notes by hand.
          printf '<!-- bridge.json %s -->\n' "$(tr -d '\n' < app/build/bridge.json)" > "$GITHUB_WORKSPACE/release-notes.md"
          cat "$GITHUB_WORKSPACE/release-notes.md"

      - name: Upload debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: TrackhopBridge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Decode release keystore
        if: ${{ env.UPLOAD_KEYSTORE_BASE64 != '' }}
        run: echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release APK
        if: ${{ env.UPLOAD_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        if: ${{ env.UPLOAD_KEYSTORE_BASE64 != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: TrackhopBridge-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Decide whether to publish a release
        id: rel
        if: ${{ github.event_name == 'push' && env.UPLOAD_KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          v=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          if [ -z "$v" ]; then echo "versionName not found"; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "Tag v$v already exists: nothing to publish."
          else
            echo "tag=v$v" >> "$GITHUB_OUTPUT"
          fi

      - name: Name release asset after the version
        if: ${{ steps.rel.outputs.tag != '' }}
        run: cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/TrackhopBridge-${{ steps.rel.outputs.tag }}.apk"

      - name: GitHub Release
        if: ${{ steps.rel.outputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            TrackhopBridge-*.apk
            bridge.json
          body_path: release-notes.md
          generate_release_notes: true
